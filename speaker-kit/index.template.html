<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RS26 Speaker Kit</title>
    <meta
      name="description"
      content="Make a banner and a post for your Reversim Summit 2026 talk."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Color+Emoji&family=Space+Grotesk:wght@400;500;600;700&display=block"
    />
    <style>
      :root {
        --navy: #0e1d42;
        --navy-2: #0a1631;
        --navy-3: #060f25;
        --line: #1e2f58;
        --panel: #0a1736;
        --panel-2: #10204a;
        --blue: #6c8cc7;
        --blue-bright: #84a2da;
        --orange: #f07a23;
        --mint: #7ccfa8;
        --text: #c3cdea;
        --muted: #8fa0c8;
        --dashed: #3a4d7a;
        --display: "Space Grotesk", "Heebo", system-ui, sans-serif;
        --body: "Hanken Grotesk", "Heebo", system-ui, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--navy);
        color: var(--text);
        font: 16px/1.5 var(--body);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }

      /* ------------------------------------------------ chrome */
      .top {
        max-width: 1120px;
        margin: 0 auto;
        padding: 20px 16px 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 24px;
      }
      .top img {
        height: 34px;
        display: block;
      }
      .top .tag {
        font: 500 12px var(--mono);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mint);
      }
      .progress {
        display: flex;
        gap: 6px;
        margin: 0 0 0 auto;
        padding: 0;
        list-style: none;
        font: 500 12px var(--mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .progress li {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--dashed);
      }
      .progress li + li::before {
        content: "";
        width: 16px;
        height: 1px;
        background: var(--line);
      }
      .progress li.done {
        color: var(--muted);
      }
      .progress li.current {
        color: var(--orange);
      }
      .progress button {
        background: none;
        border: 0;
        padding: 4px 0;
        font: inherit;
        letter-spacing: inherit;
        text-transform: inherit;
        color: inherit;
      }
      .progress button:hover {
        color: #fff;
      }
      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 32px 16px 64px;
      }
      .back {
        background: none;
        border: 0;
        padding: 6px 0;
        margin-bottom: 8px;
        font: 600 14px var(--body);
        color: var(--muted);
      }
      .back:hover {
        color: #fff;
      }
      h1 {
        font: 700 clamp(28px, 4.4vw, 44px) / 1.08 var(--display);
        letter-spacing: -0.02em;
        color: #fff;
        margin: 0 0 8px;
      }
      h1 em {
        font-style: normal;
        color: var(--orange);
      }
      .sub {
        margin: 0 0 24px;
        color: var(--muted);
        max-width: 720px;
      }
      .sub strong {
        color: var(--text);
        font-weight: 600;
      }

      /* ------------------------------------------------ step: session */
      .search {
        width: 100%;
        background: var(--panel);
        color: #fff;
        border: 1px solid var(--dashed);
        border-radius: 14px;
        font: 17px var(--body);
        padding: 14px 16px;
      }
      .list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .pick {
        width: 100%;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .pick:hover {
        border-color: var(--orange);
      }
      .pick:active {
        transform: scale(0.99);
      }
      .faces {
        display: flex;
        flex: none;
      }
      .faces img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--panel-2);
        background: var(--panel);
      }
      .faces img + img {
        margin-left: -14px;
      }
      .pick .who {
        font: 600 15px var(--body);
        color: #fff;
      }
      .pick .what {
        font-size: 14px;
        color: var(--muted);
      }
      .none {
        padding: 24px 0;
        color: var(--muted);
      }

      /* ------------------------------------------------ tiles (as / platform) */
      .tiles {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr));
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 20px;
        text-align: left;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 22px;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .tile:hover {
        border-color: var(--orange);
        transform: translateY(-2px);
      }
      .tile svg {
        width: 30px;
        height: 30px;
        color: #fff;
      }
      .tile img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        object-fit: cover;
      }
      .tile .name {
        font: 600 19px var(--display);
        color: #fff;
      }
      .tile .note {
        font: 500 12px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* ------------------------------------------------ step: design */
      .designs {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
      }
      .designs[data-format="square"] {
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
      }
      .designs[data-format="story"] {
        grid-template-columns: repeat(auto-fill, minmax(min(46%, 190px), 1fr));
      }
      .design {
        padding: 0;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 18px;
        overflow: hidden;
        text-align: left;
        transition:
          border-color 0.15s,
          transform 0.15s;
      }
      .design:hover {
        border-color: var(--orange);
        transform: translateY(-2px);
      }
      .design canvas {
        display: block;
        width: 100%;
        height: auto;
        background: var(--navy-3);
      }
      .design .name {
        display: block;
        padding: 10px 14px;
        font: 600 15px var(--display);
        color: #fff;
      }

      /* ------------------------------------------------ step: post */
      .post {
        display: grid;
        gap: 28px;
        align-items: start;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      }
      .post[data-format="story"] {
        grid-template-columns: minmax(0, 300px) minmax(0, 1fr);
      }
      .post[data-format="square"] {
        grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      }
      @media (max-width: 820px) {
        .post,
        .post[data-format] {
          grid-template-columns: 1fr;
        }
        .post[data-format="story"] .preview {
          max-width: 300px;
        }
      }
      .preview img {
        display: block;
        width: 100%;
        border-radius: 14px;
        border: 1px solid var(--line);
      }
      .preview .change {
        margin-top: 8px;
      }
      .share {
        width: 100%;
        padding: 16px;
        border: 0;
        border-radius: 14px;
        background: var(--orange);
        color: #fff;
        font: 700 17px var(--body);
      }
      .or {
        margin: 14px 0 6px;
        font: 500 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      ol.steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
        counter-reset: step;
      }
      ol.steps li {
        counter-increment: step;
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 12px;
        align-items: start;
      }
      ol.steps li::before {
        content: counter(step);
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1px solid var(--dashed);
        font: 600 14px var(--mono);
        color: var(--orange);
      }
      ol.steps li.done::before {
        content: "✓";
        background: var(--mint);
        border-color: var(--mint);
        color: var(--navy);
      }
      .act {
        padding: 9px 18px;
        border-radius: 999px;
        border: 1px solid var(--orange);
        background: var(--orange);
        color: #fff;
        font: 600 15px var(--body);
      }
      .act:hover {
        background: #ff8a36;
      }
      li.done .act {
        background: transparent;
        border-color: var(--dashed);
      }
      .hint {
        display: block;
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .say {
        font: 600 16px/32px var(--body);
        color: #fff;
      }
      /* ------------------------------------------------ step: your post */
      .fieldlabel {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font: 500 12px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .count {
        font: 500 12px var(--mono);
        letter-spacing: 0.06em;
        color: var(--muted);
        white-space: nowrap;
      }
      .count.over {
        color: var(--orange);
      }
      textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        background: var(--panel);
        color: #fff;
        border: 1px solid var(--dashed);
        border-radius: 14px;
        font: 15px/1.5 var(--body);
        padding: 12px 14px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        margin-top: 14px;
      }
      .next {
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: var(--orange);
        color: #fff;
        font: 700 16px var(--body);
      }
      .next:hover {
        background: #ff8a36;
      }

      /* A step that carries the post text: button, caption and the read-only text in
         one card, so it's clear the text travels with the click. */
      .carry {
        border: 1px solid var(--dashed);
        border-radius: 16px;
        background: var(--panel);
        padding: 12px;
      }
      .carry .hint {
        margin-top: 8px;
      }
      .payload {
        margin: 8px 0 0;
        padding: 10px 14px;
        border-left: 3px solid var(--orange);
        border-radius: 0 10px 10px 0;
        background: var(--navy-2);
        color: var(--text);
        font: 14px/1.5 var(--body);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 168px;
        overflow: auto;
      }
      .payload.url {
        font: 14px var(--mono);
        color: var(--blue-bright);
      }
      .carry .row {
        margin-top: 6px;
        gap: 4px 18px;
      }
      .carry .ghost {
        font-size: 14px;
      }
      .more {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
      }
      .ghost {
        background: none;
        border: 0;
        padding: 4px 0;
        font: 600 15px var(--body);
        color: var(--blue-bright);
      }
      .ghost:hover {
        color: #fff;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translate(-50%, 20px);
        max-width: calc(100% - 32px);
        background: #fff;
        color: var(--navy);
        font: 600 15px var(--body);
        padding: 12px 20px;
        border-radius: 14px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      @media (max-width: 640px) {
        .progress {
          width: 100%;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <img id="logo" alt="RS26 · Reversim Winter Summit" />
      <span class="tag">Speaker kit</span>
      <ol class="progress" id="progress"></ol>
    </div>
    <main id="main" aria-live="polite"></main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const SESSIONS = /*__SESSIONS__*/ [];
      const LOGO = /*__LOGO__*/ "";

      const SITE = "https://summit2026.reversim.com";
      const SITE_SHORT = "summit2026.reversim.com";
      const EVENT_DATES = "NOV 30 – DEC 1, 2026";

      const C = {
        navy: "#0e1d42",
        navy2: "#0a1631",
        navy3: "#060f25",
        line: "#1e2f58",
        panel: "#0a1736",
        panel2: "#10204a",
        white: "#ffffff",
        paper: "#f4f6fb",
        blue: "#6c8cc7",
        blueBright: "#84a2da",
        blueInk: "#3b5590",
        orange: "#f07a23",
        mint: "#7ccfa8",
        pink: "#f3a0c5",
        text: "#c3cdea",
        muted: "#8fa0c8",
        mutedInk: "#5b6f9e",
        dashed: "#3a4d7a",
      };

      // Heebo and Noto Color Emoji follow every family so Hebrew and emoji in titles always render.
      const F = {
        display: (w) => (s) =>
          `${w} ${s}px "Space Grotesk", Heebo, "Noto Color Emoji", sans-serif`,
        body: (w) => (s) =>
          `${w} ${s}px "Hanken Grotesk", Heebo, "Noto Color Emoji", sans-serif`,
        mono: (w) => (s) =>
          `${w} ${s}px "JetBrains Mono", Heebo, "Noto Color Emoji", monospace`,
      };

      const FORMATS = {
        landscape: {
          w: 1200,
          h: 630,
          k: 1,
        },
        square: {
          w: 1080,
          h: 1080,
          k: 1.2,
        },
        story: {
          w: 1080,
          h: 1920,
          k: 1.5,
        },
      };

      const RTL = /[֐-׿]/;

      // ---------------------------------------------------------------- data

      const WEEKDAYS = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
      ];
      const MONTHS = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];

      // startsAt is venue-local time with no zone ("2026-11-30T09:00:00"), so parse it by hand.
      function parseLocal(iso) {
        const [, y, mo, d, hh, mm] = iso
          .match(/^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/)
          .map(Number);
        const weekday = WEEKDAYS[new Date(Date.UTC(y, mo - 1, d)).getUTCDay()];
        return {
          weekday,
          month: MONTHS[mo - 1],
          day: d,
          minutes: hh * 60 + mm,
        };
      }

      // Everything the templates and post texts need, with the poster listed first.
      // Start times aren't final yet, so they're deliberately left out: banners and
      // posts show the day and room only.
      function describe(session, me) {
        const speakers = [
          session.speakers[me],
          ...session.speakers.filter((_, i) => i !== me),
        ];
        const start = parseLocal(session.startsAt);
        const end = parseLocal(session.endsAt);
        const plural = speakers.length > 1;
        const dayShort = `${start.weekday.slice(0, 3)}, ${start.month} ${start.day}`;
        return {
          session,
          speakers,
          plural,
          others: speakers.slice(1),
          title: session.title,
          names: speakers.map((s) => s.name).join(" & "),
          tagLine: plural ? "" : speakers[0].tagLine,
          ignite: end.minutes - start.minutes <= 10,
          dayShort,
          dayLong: `${start.weekday}, ${start.month} ${start.day}`,
          room: session.room,
          dateLine: `${dayShort} · ${session.room}`.toUpperCase(),
          speaking: plural ? "WE'RE SPEAKING" : "I'M SPEAKING",
          url: `${SITE}/session/${session.slug}`,
        };
      }

      // ---------------------------------------------------------------- assets

      const imageCache = new Map();
      function loadImage(src) {
        if (!imageCache.has(src)) {
          imageCache.set(
            src,
            new Promise((resolve) => {
              const img = new Image();
              // Sessionize sends Access-Control-Allow-Origin: *, so the canvas stays exportable.
              img.crossOrigin = "anonymous";
              img.onload = () => resolve(img);
              img.onerror = () => resolve(null);
              img.src = src;
            }),
          );
        }
        return imageCache.get(src);
      }

      let fontsReady;
      function loadFonts() {
        fontsReady ??= Promise.all(
          [
            '400 20px "Space Grotesk"',
            '500 20px "Space Grotesk"',
            '600 20px "Space Grotesk"',
            '700 20px "Space Grotesk"',
            '400 20px "Hanken Grotesk"',
            '600 20px "Hanken Grotesk"',
            '400 20px "JetBrains Mono"',
            '500 20px "JetBrains Mono"',
            '600 20px "JetBrains Mono"',
            '700 20px "JetBrains Mono"',
          ]
            .map((f) => document.fonts.load(f, "Aa09 █"))
            .concat(
              ["400 20px Heebo", "600 20px Heebo", "700 20px Heebo"].map((f) =>
                document.fonts.load(f, "אבג"),
              ),
            ),
        ).catch(() => {});
        return fontsReady;
      }

      // ---------------------------------------------------------------- drawing helpers

      function rng(seed) {
        let a = 0;
        for (const ch of seed) a = (Math.imul(a, 31) + ch.charCodeAt(0)) | 0;
        return () => {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function setFont(ctx, font, size, spacing = 0) {
        ctx.font = font(size);
        if ("letterSpacing" in ctx) ctx.letterSpacing = `${spacing * size}px`;
      }

      // Word-wraps to maxW; an explicit "\n" always starts a new line.
      function wrap(ctx, text, maxW) {
        const lines = [];
        for (const para of text.split("\n")) {
          let cur = "";
          for (const word of para.split(/\s+/).filter(Boolean)) {
            const next = cur ? `${cur} ${word}` : word;
            if (!cur || ctx.measureText(next).width <= maxW) cur = next;
            else {
              lines.push(cur);
              cur = word;
            }
          }
          if (cur) lines.push(cur);
        }
        return lines;
      }

      function ellipsize(ctx, line, maxW) {
        let s = line;
        while (s.length > 1 && ctx.measureText(`${s}…`).width > maxW)
          s = s.slice(0, -1);
        return `${s.trimEnd()}…`;
      }

      // Lays out a text spec: shrinks from spec.size towards spec.minSize until it fits
      // maxW x maxH within spec.maxLines; truncates with an ellipsis as a last resort.
      function measure(ctx, spec, maxW, maxH = Infinity) {
        const lh = spec.lh ?? 1.2;
        const minSize = spec.minSize ?? spec.size;
        const maxLines = spec.maxLines ?? 99;
        let lines, size;
        for (size = Math.round(spec.size); ; size -= 1) {
          setFont(ctx, spec.font, size, spec.spacing);
          lines = wrap(ctx, spec.text, maxW);
          const widest = Math.max(
            ...lines.map((l) => ctx.measureText(l).width),
          );
          const fits =
            lines.length <= maxLines &&
            lines.length * size * lh <= maxH + 0.5 &&
            widest <= maxW;
          if (fits || size <= minSize) break;
        }
        const allowed = Math.max(
          1,
          Math.min(maxLines, Math.floor((maxH + 0.5) / (size * lh))),
        );
        if (lines.length > allowed) {
          lines = lines.slice(0, allowed);
          lines[allowed - 1] = ellipsize(ctx, lines[allowed - 1], maxW);
        }
        lines = lines.map((l) =>
          ctx.measureText(l).width > maxW ? ellipsize(ctx, l, maxW) : l,
        );
        return {
          ...spec,
          lines,
          size,
          lineH: size * lh,
          height: lines.length * size * lh,
        };
      }

      // y is the top of the block's first line box.
      function paint(ctx, block, x, y, align = "left") {
        setFont(ctx, block.font, block.size, block.spacing);
        ctx.fillStyle = block.color;
        ctx.textAlign = align;
        ctx.textBaseline = "alphabetic";
        ctx.direction = RTL.test(block.text) ? "rtl" : "ltr";
        const baseline = (block.lineH - block.size) / 2 + block.size * 0.8;
        block.lines.forEach((line, i) =>
          ctx.fillText(line, x, y + baseline + i * block.lineH),
        );
        ctx.direction = "ltr";
      }

      // Stacks text specs vertically inside [top, bottom]. A spec with grow: true gets
      // whatever height the others leave over. Falsy specs and empty texts are skipped.
      // With dry: true nothing is painted; use it to measure the stack's height first.
      function stack(
        ctx,
        specs,
        { x, top, bottom, maxW, align = "left", valign = "top", dry = false },
      ) {
        specs = specs.filter((s) => s && s.text);
        const gapOf = (s, i) => (i ? (s.gap ?? 0) : 0);
        const fixed = new Map(
          specs.filter((s) => !s.grow).map((s) => [s, measure(ctx, s, maxW)]),
        );
        const used =
          [...fixed.values()].reduce((a, b) => a + b.height, 0) +
          specs.reduce((a, s, i) => a + gapOf(s, i), 0);
        const blocks = specs.map((s) =>
          s.grow ? measure(ctx, s, maxW, bottom - top - used) : fixed.get(s),
        );
        const total = blocks.reduce(
          (a, b, i) => a + b.height + gapOf(specs[i], i),
          0,
        );
        let y =
          valign === "center"
            ? top + (bottom - top - total) / 2
            : valign === "bottom"
              ? bottom - total
              : top;
        y = Math.max(top, y);
        const start = y;
        const ax =
          align === "center" ? x + maxW / 2 : align === "right" ? x + maxW : x;
        blocks.forEach((b, i) => {
          y += gapOf(specs[i], i);
          if (!dry) paint(ctx, b, ax, y, align);
          y += b.height;
        });
        return { top: start, bottom: y };
      }

      // Single line of text at a baseline, shrunk to fit maxW if given.
      function label(
        ctx,
        text,
        x,
        baseline,
        { font, size, color, align = "left", spacing = 0, maxW = Infinity },
      ) {
        let s = size;
        setFont(ctx, font, s, spacing);
        while (s > size * 0.6 && ctx.measureText(text).width > maxW)
          setFont(ctx, font, --s, spacing);
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "alphabetic";
        ctx.direction = RTL.test(text) ? "rtl" : "ltr";
        ctx.fillText(text, x, baseline);
        ctx.direction = "ltr";
        return ctx.measureText(text).width;
      }

      // Largest size (<= maxSize) at which every text fits on one line within maxW.
      function sharedSize(ctx, texts, font, maxW, maxSize, spacing = 0) {
        setFont(ctx, font, 100, spacing);
        const widest = Math.max(...texts.map((t) => ctx.measureText(t).width));
        // 2% slack: text width doesn't scale perfectly linearly with font size, and a
        // line that overshoots by a pixel would wrap and get cut with an ellipsis.
        return Math.min(maxSize, Math.floor((98 * maxW) / widest));
      }

      function rr(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function circle(ctx, x, y, r) {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
      }

      // focusY 0.15: headshots keep the face in the upper part of the frame.
      function drawCover(ctx, img, x, y, w, h, focusY = 0.15) {
        const s = Math.max(w / img.width, h / img.height);
        const sw = w / s;
        const sh = h / s;
        ctx.drawImage(
          img,
          (img.width - sw) / 2,
          (img.height - sh) * focusY,
          sw,
          sh,
          x,
          y,
          w,
          h,
        );
      }

      function initials(name) {
        return name
          .split(/\s+/)
          .map((p) => p[0])
          .slice(0, 2)
          .join("")
          .toUpperCase();
      }

      // A photo box (rect) with initials as the fallback when the photo didn't load.
      function photoRect(ctx, img, name, x, y, w, h) {
        if (img) drawCover(ctx, img, x, y, w, h);
        else {
          ctx.fillStyle = C.panel2;
          ctx.fillRect(x, y, w, h);
          label(
            ctx,
            initials(name),
            x + w / 2,
            y + h / 2 + Math.min(w, h) * 0.12,
            {
              font: F.display(700),
              size: Math.min(w, h) * 0.32,
              color: C.blueBright,
              align: "center",
            },
          );
        }
      }

      function avatar(
        ctx,
        img,
        name,
        cx,
        cy,
        r,
        { ring = C.orange, ringW = r * 0.05, glow = null } = {},
      ) {
        if (glow) {
          ctx.save();
          ctx.shadowColor = glow;
          ctx.shadowBlur = r * 0.7;
          circle(ctx, cx, cy, r + ringW);
          ctx.fillStyle = glow;
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        circle(ctx, cx, cy, r);
        ctx.clip();
        photoRect(ctx, img, name, cx - r, cy - r, r * 2, r * 2);
        ctx.restore();
        if (ring) {
          circle(ctx, cx, cy, r + ringW / 2);
          ctx.lineWidth = ringW;
          ctx.strokeStyle = ring;
          ctx.stroke();
        }
      }

      function background(ctx, W, H, rand, { glow = true } = {}) {
        ctx.fillStyle = C.navy;
        ctx.fillRect(0, 0, W, H);
        if (glow) {
          const g = ctx.createRadialGradient(
            W * 0.8,
            H * 0.15,
            0,
            W * 0.8,
            H * 0.15,
            Math.max(W, H) * 0.9,
          );
          g.addColorStop(0, "#182c63");
          g.addColorStop(0.55, C.navy);
          g.addColorStop(1, C.navy2);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
        }
        // Faint dot grid, as on the site's hero.
        ctx.fillStyle = "rgba(132,162,218,0.07)";
        for (let y = 20; y < H; y += 32)
          for (let x = 20; x < W; x += 32) ctx.fillRect(x, y, 2, 2);
        // Stars.
        const n = Math.round((W * H) / 9000);
        for (let i = 0; i < n; i++) {
          ctx.fillStyle = `rgba(200,214,245,${0.15 + rand() * 0.5})`;
          circle(ctx, rand() * W, rand() * H, 0.8 + rand() * 1.6);
          ctx.fill();
        }
      }

      // The hero's node graph: small colored nodes joined to their nearest neighbours.
      // Anchors (where photos go) take part in the edges but are drawn by the caller.
      function constellation(ctx, rand, box, anchors = [], count = 9) {
        const colors = [
          C.blue,
          C.mint,
          C.orange,
          C.pink,
          C.blueBright,
          C.mint,
          C.blue,
        ];
        const nodes = anchors.map((a) => ({ ...a, anchor: true }));
        for (
          let tries = 0;
          nodes.length < anchors.length + count && tries < 400;
          tries++
        ) {
          const p = { x: box.x + rand() * box.w, y: box.y + rand() * box.h };
          const clear = nodes.every(
            (o) =>
              Math.hypot(o.x - p.x, o.y - p.y) > (o.anchor ? o.r + 40 : 70),
          );
          if (clear)
            nodes.push({
              ...p,
              r: 4 + rand() * 5,
              color: colors[Math.floor(rand() * colors.length)],
            });
        }
        const edges = new Set();
        nodes.forEach((n, i) => {
          const near = nodes
            .map((o, j) => [j, Math.hypot(o.x - n.x, o.y - n.y)])
            .filter(([j]) => j !== i)
            .sort((a, b) => a[1] - b[1]);
          const take = rand() < 0.5 ? 2 : 1;
          near
            .slice(0, take)
            .forEach(([j]) => edges.add(i < j ? `${i}-${j}` : `${j}-${i}`));
        });
        const list = [...edges].map((e) => e.split("-").map(Number));
        const hot = Math.floor(rand() * list.length);
        list.forEach(([a, b], i) => {
          ctx.beginPath();
          ctx.moveTo(nodes[a].x, nodes[a].y);
          ctx.lineTo(nodes[b].x, nodes[b].y);
          ctx.strokeStyle =
            i === hot ? "rgba(240,122,35,0.75)" : "rgba(132,162,218,0.3)";
          ctx.lineWidth = i === hot ? 2.5 : 1.5;
          ctx.stroke();
        });
        nodes
          .filter((n) => !n.anchor)
          .forEach((n) => {
            ctx.save();
            ctx.shadowColor = n.color;
            ctx.shadowBlur = 18;
            circle(ctx, n.x, n.y, n.r);
            ctx.fillStyle = n.color;
            ctx.fill();
            ctx.restore();
            circle(ctx, n.x, n.y, n.r);
            ctx.strokeStyle = "rgba(255,255,255,0.55)";
            ctx.lineWidth = 1.5;
            ctx.stroke();
          });
      }

      function logo(ctx, img, x, y, w) {
        if (img) ctx.drawImage(img, x, y, w, (w * img.height) / img.width);
      }

      // Rounded "pill" chips in a row; wraps when maxW is exceeded. Returns the bottom y.
      function pills(
        ctx,
        items,
        x,
        y,
        { size, h, padX, gap, color, stroke, fill = null, maxW },
      ) {
        let cx = x;
        let cy = y;
        for (const text of items) {
          setFont(ctx, F.mono(500), size, 0.06);
          const w = ctx.measureText(text).width + padX * 2;
          if (cx > x && cx + w > x + maxW) {
            cx = x;
            cy += h + gap;
          }
          rr(ctx, cx, cy, w, h, h / 2);
          if (fill) {
            ctx.fillStyle = fill;
            ctx.fill();
          }
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 2;
          ctx.stroke();
          label(ctx, text, cx + padX, cy + h / 2 + size * 0.36, {
            font: F.mono(500),
            size,
            color,
            spacing: 0.06,
          });
          cx += w + gap;
        }
        return cy + h;
      }

      // ---------------------------------------------------------------- templates
      // Each template draws one banner for a session at the given format.
      // Coordinates are per format; font sizes scale by the format's k.

      // A slightly rotated rubber-stamp mark ("SPEAKER") for the Ticket design.
      function stamp(ctx, { cx, cy, w, h }, I, rand) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(-0.12);
        ctx.strokeStyle = C.orange;
        ctx.lineWidth = h * 0.05;
        rr(ctx, -w / 2, -h / 2, w, h, h * 0.16);
        ctx.stroke();
        ctx.lineWidth = h * 0.02;
        rr(
          ctx,
          -w / 2 + h * 0.09,
          -h / 2 + h * 0.09,
          w - h * 0.18,
          h - h * 0.18,
          h * 0.1,
        );
        ctx.stroke();
        label(ctx, "★ RS26 ★", 0, -h * 0.12, {
          font: F.mono(700),
          size: h * 0.15,
          color: C.orange,
          align: "center",
          spacing: 0.3,
        });
        label(ctx, I.plural ? "SPEAKERS" : "SPEAKER", 0, h * 0.27, {
          font: F.display(700),
          size: h * 0.36,
          color: C.orange,
          align: "center",
          spacing: 0.08,
          maxW: w - h * 0.4,
        });
        // Worn-ink speckle: paper-colored flecks knocked out of the mark.
        ctx.fillStyle = C.paper;
        for (let i = 0; i < 70; i++) {
          circle(
            ctx,
            (rand() - 0.5) * w,
            (rand() - 0.5) * h,
            h * (0.008 + rand() * 0.022),
          );
          ctx.fill();
        }
        ctx.restore();
      }

        I.others.length
          ? `${lead}${I.others.map((s) => s.name).join(" & ")}`
          : "";

      // ---------------------------------------------------------------- actions

      const canCopyImage =
        typeof ClipboardItem !== "undefined" && !!navigator.clipboard?.write;
      const canShareFiles = (() => {
        try {
          return !!navigator.canShare?.({
            files: [new File([""], "x.png", { type: "image/png" })],
          });
        } catch {
          return false;
        }
      })();

      let toastTimer;
      function toast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
      }

      // Synchronous copy first, so a window.open() right after still counts as part of
      // the click (popup blockers); the async clipboard API is the fallback.
      async function copyText(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.append(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch {}
        ta.remove();
        if (ok) return true;
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch {
          return false;
        }
      }

      function openTab(url) {
        window.open(url, "_blank", "noopener");
        return true;
      }

      async function copyBanner(ctx) {
        try {
          // Hand over the promise directly; Safari requires the write to start in the click.
          await navigator.clipboard.write([
            new ClipboardItem({ "image/png": ctx.banner.blobPromise }),
          ]);
          toast("Banner copied.");
          return true;
        } catch {
          toast("Couldn't copy the banner here. Downloading it instead.");
          return downloadBanner(ctx);
        }
      }

      function downloadBanner(ctx) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(ctx.banner.blob);
        a.download = ctx.banner.fileName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        return true;
      }

      // The first step of most platforms: get the banner onto the clipboard, or disk.
      const bannerStep = (hint) =>
        canCopyImage
          ? {
              label: "Copy banner",
              run: copyBanner,
              hint: hint ?? "Puts the banner on your clipboard.",
            }
          : {
              label: "Download banner",
              run: downloadBanner,
              hint: hint ?? "Saves the banner as a PNG.",
            };
      const pasteIt = canCopyImage
        ? "Paste the banner into the post (Ctrl/⌘+V)"
        : "Attach the banner you downloaded";

      // ---------------------------------------------------------------- platforms
      // Each platform picks the banner size, writes the post, and lists the actions
      // in the order that platform needs them.

      const PLATFORMS = {
        linkedin: {
          label: "LinkedIn",
          icon: "linkedin",
          format: "landscape",
          note: "Landscape banner",
          text(I) {
            return (
              `🎤 I'm speaking at Reversim Summit 2026!\n\n${quote(I.title)}${withNames(I, "\nTogether with ")}\n\n` +
              `📅 ${I.dayLong}\n📍 ${I.room}\n\n` +
              `RS26 is a two-day, community-driven conference for Israel's software industry (Nov 30 – Dec 1). ` +
              `If you're coming, come say hi.\n\nSession details and the full agenda: ${I.url}\n\n#RS26 #Reversim #ReversimSummit`
            );
          },
          steps: () => [
            bannerStep(),
            {
              label: "Open LinkedIn",
              // Unofficial but working pre-fill.
              run: (ctx) =>
                openTab(
                  `https://www.linkedin.com/feed/?shareActive=true&text=${encodeURIComponent(ctx.text())}`,
                ),
              hint: "Opens LinkedIn with this post filled in:",
              payload: "text",
              // LinkedIn's pre-fill is unofficial, so offer the text by hand too.
              copyFallback: true,
            },
            { say: `${pasteIt}, then post.` },
          ],
        },
        x: {
          label: "X",
          icon: "x-twitter",
          format: "landscape",
          note: "Landscape banner",
          text(I) {
            const mention = (s) => (s.twitter ? `@${s.twitter}` : s.name);
            const withPart = I.others.length
              ? ` with ${I.others.map(mention).join(" & ")}`
              : "";
            const build = (title) =>
              `🎤 I'm speaking at #RS26, Reversim Summit 2026!\n\n${quote(title)}${withPart}\n📅 ${I.dayLong} · ${I.room}\n\nCome say hi 👋\n${I.url}`;
            let title = I.title;
            while (xLength(build(title)) > 280 && title.length > 10)
              title = title.slice(0, -2).trimEnd() + "…";
            return build(title);
          },
          limit: 280,
          steps: () => [
            bannerStep(),
            {
              label: "Open X",
              run: (ctx) =>
                openTab(
                  `https://x.com/intent/post?text=${encodeURIComponent(ctx.text())}`,
                ),
              hint: "Opens X with this post filled in:",
              payload: "text",
            },
            { say: `${pasteIt}, then post.` },
          ],
        },
        facebook: {
          label: "Facebook",
          icon: "facebook",
          format: "landscape",
          note: "Landscape banner",
          text(I) {
            return (
              `🎤 I'm speaking at Reversim Summit 2026${withNames(I, " together with ")}!\n\n${quote(I.title)}\n📅 ${I.dayLong} · ${I.room}\n\n` +
              `Coming to RS26? Come say hi 👋\n${I.url}\n\n#RS26 #Reversim`
            );
          },
          // Facebook doesn't allow pre-filled post text, so the text goes via the clipboard first.
          steps: () => [
            {
              label: "Copy text & open Facebook",
              run: async (ctx) => {
                const ok = await copyText(ctx.text());
                openTab("https://www.facebook.com/");
                return ok;
              },
              hint: "Facebook doesn't let other sites fill in a post, so this copies it. Start a new post and paste:",
              payload: "text",
            },
            bannerStep(
              canCopyImage
                ? "Then paste it into the same post."
                : "Then attach it to the same post.",
            ),
            { say: "Post." },
          ],
        },
        whatsapp: {
          label: "WhatsApp",
          icon: "whatsapp",
          format: "square",
          note: "Square banner",
          // No emoji: WhatsApp Web/Desktop can turn emoji passed in a share link into "�".
          text(I) {
            return `I'm speaking at *Reversim Summit 2026*${withNames(I, " together with ")}!\n\n*${I.title}*\n${I.dayLong} · ${I.room}\n\n${I.url}`;
          },
          steps: () => [
            bannerStep(),
            {
              label: "Open WhatsApp",
              run: (ctx) =>
                openTab(
                  // Not wa.me: its redirect is the usual culprit for mangled characters.
                  `https://api.whatsapp.com/send?text=${encodeURIComponent(ctx.text())}`,
                ),
              hint: "Opens WhatsApp with this message filled in. You pick the chat:",
              payload: "text",
            },
            { say: `${pasteIt}, then send.` },
          ],
        },
        story: {
          label: "Story",
          icon: "instagram",
          format: "story",
          note: "Instagram · WhatsApp Status",
          // Stories have no caption; the link goes on a sticker instead.
          text: null,
          steps: () => [
            {
              label: "Download banner",
              run: downloadBanner,
              hint: "A story-sized PNG.",
            },
            {
              label: "Copy session link",
              run: async (ctx) =>
                (await copyText(ctx.I.url)) && (toast("Link copied."), true),
              hint: "For Instagram's Link sticker:",
              payload: "url",
            },
            { say: "Post it to your story." },
          ],
        },
      };

      // Generic chat bubble: the site's icon set has no WhatsApp glyph.
      const ICONS = {
        .../*__ICONS__*/ {},
        whatsapp:
          '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1C4.13 1 1 3.69 1 7c0 1.62.75 3.09 1.97 4.17L2.3 15l3.73-1.86c.62.15 1.28.23 1.97.23 3.87 0 7-2.69 7-6S11.87 1 8 1z"/></svg>',
      };

      // ---------------------------------------------------------------- banners

      const banners = new Map();

      // Renders (once) one template for the current session and size.
      function getBanner(st, templateId, fmt) {
        const I = describe(SESSIONS[st.session], st.as);
        const key = [I.session.slug, st.as, fmt, templateId].join("|");
        if (!banners.has(key)) {
          banners.set(
            key,
            (async () => {
              const [logoImg, photos] = await Promise.all([
                loadImage(LOGO),
                Promise.all(I.speakers.map((s) => loadImage(s.photo))),
                loadFonts(),
                // Only fetches emoji subsets if the session text actually contains emoji.
                document.fonts
                  .load(
                    '20px "Noto Color Emoji"',
                    I.title + I.names + I.tagLine,
                  )
                  .catch(() => {}),
              ]);
              const { w, h } = FORMATS[fmt];
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const template = TEMPLATES.find((t) => t.id === templateId);
              template.draw(canvas.getContext("2d"), fmt, I, {
                logo: logoImg,
                photos,
              });
              const banner = {
                canvas,
                blob: null,
                blobPromise: new Promise((resolve) =>
                  canvas.toBlob(resolve, "image/png"),
                ),
                fileName: `rs26-${I.session.slug.slice(0, 60)}-${templateId}-${fmt}.png`,
              };
              banner.blobPromise.then((b) => (banner.blob = b));
              return banner;
            })(),
          );
        }
        return banners.get(key);
      }

      // ---------------------------------------------------------------- wizard
      // The URL holds the wizard's state (?session=&as=&platform=&design=&ready=), so the
      // browser's Back button works and any step can be linked to directly.

      const $ = (id) => document.getElementById(id);
      const main = $("main");
      // Edited post texts, per session + speaker + platform. Kept in sessionStorage so a
      // reload doesn't lose them.
      const EDITS_KEY = "rs26-speaker-kit-edits";
      const edited = new Map(
        (() => {
          try {
            return JSON.parse(sessionStorage.getItem(EDITS_KEY)) ?? [];
          } catch {
            return [];
          }
        })(),
      );
      const textKey = (st) =>
        [SESSIONS[st.session].slug, st.as, st.platform].join("|");
      const postText = (st, I) =>
        edited.get(textKey(st)) ?? PLATFORMS[st.platform].text(I);
      function saveText(st, value) {
        if (value === null) edited.delete(textKey(st));
        else edited.set(textKey(st), value);
        try {
          sessionStorage.setItem(EDITS_KEY, JSON.stringify([...edited]));
        } catch {}
      }
      let renderToken = 0;
      let previewUrl = null;

      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      function readState() {
        const p = new URLSearchParams(location.search);
        const idx = SESSIONS.findIndex((s) => s.slug === p.get("session"));
        const session = idx >= 0 ? idx : null;
        const n = session === null ? 0 : SESSIONS[session].speakers.length;
        const as = Number(p.get("as"));
        return {
          session,
          // Solo talks skip the "who's posting" question.
          as: n === 1 ? 0 : p.has("as") && as >= 0 && as < n ? as : null,
          platform: PLATFORMS[p.get("platform")] ? p.get("platform") : null,
          design: TEMPLATES.some((t) => t.id === p.get("design"))
            ? p.get("design")
            : null,
          ready: p.get("ready") === "1",
        };
      }

      function stepOf(st) {
        if (st.session === null) return "session";
        if (st.as === null) return "as";
        if (!st.platform) return "platform";
        if (!st.design) return "design";
        // Stories have no post text, so they skip straight to posting.
        if (PLATFORMS[st.platform].text && !st.ready) return "text";
        return "post";
      }

      // Applies changes to the URL (null removes a key) and renders the new step.
      function go(changes) {
        const p = new URLSearchParams(location.search);
        for (const [k, v] of Object.entries(changes)) {
          if (v === null) p.delete(k);
          else p.set(k, v);
        }
        history.pushState(
          null,
          "",
          `${location.pathname}${p.size ? `?${p}` : ""}`,
        );
        render();
        window.scrollTo(0, 0);
      }
      window.addEventListener("popstate", render);

      const RESET = {
        session: null,
        as: null,
        platform: null,
        design: null,
        ready: null,
      };
      const isPlural = (st) => SESSIONS[st.session].speakers.length > 1;

      function backButton(changes, label) {
        const b = document.createElement("button");
        b.className = "back";
        b.textContent = `← ${label}`;
        b.onclick = () => go(changes);
        return b;
      }

      function renderProgress(st, step) {
        const hasText = !st.platform || PLATFORMS[st.platform].text;
        const steps = [
          ["session", "Session", RESET],
          [
            "platform",
            "Platform",
            { platform: null, design: null, ready: null },
          ],
          ["design", "Design", { design: null }],
          hasText && ["text", "Text", { ready: null }],
          ["post", "Post", null],
        ].filter(Boolean);
        const current = step === "as" ? "session" : step;
        const at = steps.findIndex(([id]) => id === current);
        $("progress").innerHTML = "";
        steps.forEach(([id, label, changes], i) => {
          const li = document.createElement("li");
          li.className = i < at ? "done" : i === at ? "current" : "";
          if (i < at) {
            const b = document.createElement("button");
            b.textContent = label;
            b.onclick = () => go(changes);
            li.append(b);
          } else li.textContent = label;
          if (i === at) li.setAttribute("aria-current", "step");
          $("progress").append(li);
        });
      }

      function render() {
        const token = ++renderToken;
        const st = readState();
        const step = stepOf(st);
        renderProgress(st, step);
        main.innerHTML = "";
        ({
          session: renderSession,
          as: renderAs,
          platform: renderPlatform,
          design: renderDesign,
          text: renderText,
          post: renderPost,
        })[step](st, token);
      }

      function faces(speakers) {
        return `<span class="faces">${speakers
          .map(
            (s) =>
              `<img src="${esc(s.photo)}" alt="" crossorigin="anonymous" loading="lazy" />`,
          )
          .join("")}</span>`;
      }

      // ---- 1. session

      const sortedSessions = SESSIONS.map((s, i) => ({
        i,
        who: s.speakers.map((p) => p.name).join(" & "),
        s,
      })).sort((a, b) => a.who.localeCompare(b.who));

      function renderSession() {
        main.innerHTML = `
          <h1>Which session is <em>yours</em>?</h1>
          <p class="sub">Pick your talk, and you'll get banners and a ready-to-post text for it.</p>
          <input class="search" type="search" placeholder="Search by your name or your talk's title" aria-label="Search sessions" />
          <ul class="list"></ul>`;
        const input = main.querySelector(".search");
        const list = main.querySelector(".list");
        const show = () => {
          const q = input.value.trim().toLowerCase();
          const hits = sortedSessions.filter(
            ({ who, s }) => !q || `${who} ${s.title}`.toLowerCase().includes(q),
          );
          list.innerHTML = hits.length
            ? hits
                .map(
                  ({ i, who, s }) => `
                  <li><button class="pick" data-i="${i}">
                    ${faces(s.speakers)}
                    <span><span class="who">${esc(who)}</span><br /><span class="what" dir="auto">${esc(s.title)}</span></span>
                  </button></li>`,
                )
                .join("")
            : `<li class="none">No session matches “${esc(input.value)}”.</li>`;
        };
        input.oninput = show;
        input.onkeydown = (e) => {
          if (e.key === "Enter") list.querySelector(".pick")?.click();
        };
        list.onclick = (e) => {
          const b = e.target.closest(".pick");
          if (b) go({ ...RESET, session: SESSIONS[b.dataset.i].slug });
        };
        show();
        input.focus();
      }

      // ---- 1b. who's posting (two-speaker sessions only)

      function renderAs(st) {
        const s = SESSIONS[st.session];
        main.append(backButton(RESET, "Different session"));
        main.insertAdjacentHTML(
          "beforeend",
          `<h1>Who's <em>posting</em>?</h1>
           <p class="sub" dir="auto"><strong>${esc(s.title)}</strong></p>
           <div class="tiles">${s.speakers
             .map(
               (p, i) => `<button class="tile" data-i="${i}">
                 <img src="${esc(p.photo)}" alt="" crossorigin="anonymous" />
                 <span class="name">${esc(p.name)}</span>
               </button>`,
             )
             .join("")}</div>`,
        );
        main.querySelector(".tiles").onclick = (e) => {
          const b = e.target.closest(".tile");
          if (b) go({ as: b.dataset.i });
        };
      }

      // ---- 2. platform

      function renderPlatform(st) {
        const I = describe(SESSIONS[st.session], st.as);
        main.append(
          isPlural(st)
            ? backButton({ as: null }, "Who's posting")
            : backButton(RESET, "Different session"),
        );
        main.insertAdjacentHTML(
          "beforeend",
          `<h1>Where are you <em>posting</em>?</h1>
           <p class="sub"><strong dir="auto">${esc(I.title)}</strong> · ${esc(I.names)}</p>
           <div class="tiles">${Object.entries(PLATFORMS)
             .map(
               ([id, p]) => `<button class="tile" data-id="${id}">
                 ${ICONS[p.icon] ?? ""}
                 <span class="name">${esc(p.label)}</span>
                 <span class="note">${esc(p.note)}</span>
               </button>`,
             )
             .join("")}</div>`,
        );
        main.querySelector(".tiles").onclick = (e) => {
          const b = e.target.closest(".tile");
          if (b) go({ platform: b.dataset.id, design: null, ready: null });
        };
      }

      // ---- 3. design

      function renderDesign(st, token) {
        const p = PLATFORMS[st.platform];
        const { w, h } = FORMATS[p.format];
        main.append(backButton({ platform: null }, "Platform"));
        main.insertAdjacentHTML(
          "beforeend",
          `<h1>Pick a <em>design</em></h1>
           <p class="sub">For ${esc(p.label)} · ${w}×${h}</p>
           <div class="designs" data-format="${p.format}"></div>`,
        );
        const grid = main.querySelector(".designs");
        for (const t of TEMPLATES) {
          const b = document.createElement("button");
          b.className = "design";
          b.setAttribute("aria-label", `${t.name} design`);
          // Placeholder with the banner's aspect ratio until it's drawn.
          const ph = document.createElement("canvas");
          ph.width = w;
          ph.height = h;
          b.append(ph);
          b.insertAdjacentHTML(
            "beforeend",
            `<span class="name">${esc(t.name)}</span>`,
          );
          b.onclick = () => go({ design: t.id });
          grid.append(b);
          getBanner(st, t.id, p.format).then((banner) => {
            if (token === renderToken) ph.replaceWith(banner.canvas);
          });
        }
      }

      // Shared by the last two stages: waits for the banner and returns a preview URL.
      async function bannerPreview(st, token) {
        const banner = await getBanner(
          st,
          st.design,
          PLATFORMS[st.platform].format,
        );
        await banner.blobPromise;
        if (token !== renderToken) return null;
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(banner.blob);
        return banner;
      }

      // ---- 4. your post (skipped for stories)

      async function renderText(st, token) {
        const p = PLATFORMS[st.platform];
        const I = describe(SESSIONS[st.session], st.as);
        if (!(await bannerPreview(st, token))) return;

        main.append(backButton({ design: null }, "Design"));
        main.insertAdjacentHTML(
          "beforeend",
          `<h1>Your <em>post</em></h1>
           <p class="sub">We wrote one for ${esc(p.label)}. Make it yours, or keep it as is.</p>
           <div class="post" data-format="${p.format}">
             <div class="preview"><img src="${previewUrl}" alt="Your banner" /></div>
             <div>
               <label class="fieldlabel" for="text"><span>Post text</span><span class="count"></span></label>
               <textarea id="text" spellcheck="true"></textarea>
               <div class="row">
                 <button class="next">Looks good →</button>
                 <button class="ghost reset">Reset to our suggestion</button>
               </div>
             </div>
           </div>`,
        );
        const ta = main.querySelector("textarea");
        const count = main.querySelector(".count");
        const update = () => {
          if (!p.limit) return;
          const n = xLength(ta.value);
          count.textContent = `${n} / ${p.limit}`;
          count.classList.toggle("over", n > p.limit);
        };
        ta.value = postText(st, I);
        ta.oninput = () => {
          saveText(st, ta.value);
          update();
        };
        update();
        main.querySelector(".reset").onclick = () => {
          saveText(st, null);
          ta.value = postText(st, I);
          update();
        };
        main.querySelector(".next").onclick = () => go({ ready: "1" });
      }

      // ---- 5. post it

      async function renderPost(st, token) {
        const p = PLATFORMS[st.platform];
        const I = describe(SESSIONS[st.session], st.as);
        const banner = await bannerPreview(st, token);
        if (!banner) return;
        const text = p.text ? postText(st, I) : null;
        const ctx = { I, banner, text: () => text };

        main.append(
          p.text
            ? backButton({ ready: null }, "Your post")
            : backButton({ design: null }, "Design"),
        );
        main.insertAdjacentHTML(
          "beforeend",
          `<h1>${p.text ? `Post it on <em>${esc(p.label)}</em>` : "Post it to your <em>story</em>"}</h1>
           <p class="sub">Follow the steps in order.</p>
           <div class="post" data-format="${p.format}">
             <div class="preview">
               <img src="${previewUrl}" alt="Your banner" />
               <button class="ghost change">← Change design</button>
             </div>
             <div>
               ${
                 canShareFiles
                   ? `<button class="share">${p.text ? "Share banner + text…" : "Share banner…"}</button>
                      <div class="or">or step by step</div>`
                   : ""
               }
               <ol class="steps"></ol>
             </div>
           </div>
           <div class="more">
             <button class="ghost other">Post on another platform too →</button>
             <button class="ghost restart">Start over</button>
           </div>`,
        );

        const ol = main.querySelector(".steps");
        for (const s of p.steps()) {
          const li = document.createElement("li");
          if (s.say) {
            li.innerHTML = `<span class="say">${esc(s.say)}</span>`;
            ol.append(li);
            continue;
          }
          const b = document.createElement("button");
          b.className = "act";
          b.textContent = s.label;
          b.onclick = async () => {
            if (await s.run(ctx)) li.classList.add("done");
          };
          // Button and hint share the column next to the step number. A step that
          // sends the text (or link) shows it, read-only, in the same card.
          const body = document.createElement("div");
          if (s.payload) body.className = "carry";
          body.append(b);
          body.insertAdjacentHTML(
            "beforeend",
            `<span class="hint">${esc(s.hint)}</span>`,
          );
          if (s.payload === "text") {
            body.insertAdjacentHTML(
              "beforeend",
              `<blockquote class="payload" dir="auto">${esc(text)}</blockquote>
               <div class="row">
                 <button class="ghost edit">Edit post</button>
                 ${s.copyFallback ? `<button class="ghost copy">Text didn't show up? Copy it</button>` : ""}
               </div>`,
            );
            body.querySelector(".edit").onclick = () => go({ ready: null });
            const copy = body.querySelector(".copy");
            if (copy)
              copy.onclick = async () => {
                if (await copyText(text))
                  toast("Text copied. Paste it into LinkedIn.");
              };
          } else if (s.payload === "url") {
            body.insertAdjacentHTML(
              "beforeend",
              `<div class="payload url">${esc(I.url)}</div>`,
            );
          }
          li.append(body);
          ol.append(li);
        }

        main.querySelector(".share")?.addEventListener("click", async () => {
          const file = new File([banner.blob], banner.fileName, {
            type: "image/png",
          });
          try {
            await navigator.share(
              text ? { files: [file], text } : { files: [file] },
            );
          } catch (err) {
            if (err.name !== "AbortError")
              toast("Sharing didn't work here. Use the steps below.");
          }
        });
        main.querySelector(".change").onclick = () => go({ design: null });
        main.querySelector(".other").onclick = () =>
          go({ platform: null, design: null, ready: null });
        main.querySelector(".restart").onclick = () => go(RESET);
      }

      $("logo").src = LOGO;
      render();
    </script>
  </body>
</html>
