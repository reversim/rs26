name: Pull Request

on:
  pull_request:

# A new push replaces the run still in progress for the same PR.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # The MCP server is a separate package with its own toolchain, so it is checked on its
  # own. Note Hosting preview channels cannot host their own copy of a function: a /mcp
  # request against a preview URL hits the live function, so there is nothing to preview
  # here — these checks are what gate a function change.
  mcp-function:
    name: Validate MCP function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history, so the "what changed" diff below always resolves.
          fetch-depth: 0

      - name: Check whether the function changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # When the range cannot be resolved (shallow clone, force-pushed base) run the
          # checks rather than skip: a redundant run is worse than an unvalidated merge.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Cannot resolve the base commit — running the checks to be safe."
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" \
            | grep -qE '^(functions/|firebase\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed under functions/ — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          # Must match the runtime in firebase.json.
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        working-directory: functions
        run: npm ci

      - name: Set timezone
        if: steps.changed.outputs.run == 'true'
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: Asia/Jerusalem

      - name: Lint
        if: steps.changed.outputs.run == 'true'
        working-directory: functions
        run: npm run lint

      - name: Check formatting
        if: steps.changed.outputs.run == 'true'
        working-directory: functions
        run: npm run format:check

      - name: Check types
        if: steps.changed.outputs.run == 'true'
        working-directory: functions
        run: npm run typecheck

      - name: Test
        if: steps.changed.outputs.run == 'true'
        working-directory: functions
        run: npm test

      # The deploy builds from source, so a build failure must not wait for main.
      - name: Build
        if: steps.changed.outputs.run == 'true'
        working-directory: functions
        run: npm run build

  validate-and-preview:
    name: Validate and preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: Asia/Jerusalem

      - name: Lint
        run: yarn lint

      - name: Check types
        run: yarn astro-check

      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium

      - name: Test
        run: yarn test:ci

      # Pull requests from forks don't get secrets, so they can't deploy and
      # only need to check that the site builds.
      - name: Build
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: yarn build

      # Builds the site as well, so same-repo pull requests build only once.
      - name: Deploy preview
        id: preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          # Channel IDs allow lowercase letters, numbers and hyphens, and the
          # length is capped so the channel's hostname stays a valid DNS label.
          channel=$(printf '%s' "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9-]+/-/g; s/^-+//' \
            | cut -c1-40 \
            | sed -E 's/-+$//')

          yarn deploy:preview "$channel" 7d

          url=$(npx -y firebase-tools hosting:channel:list --json \
            | jq -r --arg name "$channel" \
              '.result.channels[] | select(.name | endswith("/channels/" + $name)) | .url')
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Updates the same comment on every push rather than adding a new one.
      - name: Comment preview URL on the pull request
        if: steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body \
            "🚀 **Preview deployed:** $PREVIEW_URL

          Commit: $COMMIT_SHA. The preview expires 7 days after the last push."
